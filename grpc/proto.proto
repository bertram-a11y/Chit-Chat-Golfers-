syntax = "proto3";

package chat;
option go_package = "chit-chat/grpc;chatpb";

service ChatService {
    rpc Chat(stream ClientEvent) returns (stream ServerEvent);
}

message ClientEvent {
    string client_id = 1;
    int64 lamport_time = 2;
    oneof event {
        JoinRequest join = 3;
        PublishRequest publish = 4;
        LeaveRequest leave = 5;
    }
}

message JoinRequest {}

message PublishRequest {
    string content = 1;
}

message LeaveRequest {}

enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    JOINED = 1;
    PUBLISHED = 2;
    LEFT = 3;
}

message ServerEvent {
    EventType type = 1;
    string client_id = 2;
    string content = 3;
    int64 lamport_time = 4;
}